<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringkasan Perkuliahan</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --success-color: #27ae60;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }
        
        .form-section {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .summary-list {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: var(--secondary-color);
        }
        
        .btn-delete {
            background-color: #e74c3c;
        }
        
        .btn-delete:hover {
            background-color: #c0392b;
        }
        
        .summary-item {
            background-color: var(--light-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }
        
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .summary-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark-color);
        }
        
        .summary-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .summary-content {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .tag {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ringkasan Perkuliahan</h1>
            <p class="subtitle">Catat dan kelola ringkasan setiap pertemuan kuliah dengan mudah</p>
        </header>
        
        <div class="app-container">
            <section class="form-section">
                <h2>Tambah Ringkasan Baru</h2>
                <form id="summaryForm">
                    <div class="form-group">
                        <label for="courseName">Mata Kuliah</label>
                        <input type="text" id="courseName" placeholder="Contoh: Algoritma dan Pemrograman" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="meetingNumber">Pertemuan Ke-</label>
                        <input type="number" id="meetingNumber" min="1" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="meetingDate">Tanggal Pertemuan</label>
                        <input type="date" id="meetingDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="lecturer">Dosen Pengajar</label>
                        <input type="text" id="lecturer" placeholder="Nama dosen">
                    </div>
                    
                    <div class="form-group">
                        <label for="topic">Topik Pembahasan</label>
                        <input type="text" id="topic" placeholder="Topik yang dibahas" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="summary">Ringkasan Materi</label>
                        <textarea id="summary" placeholder="Tulis ringkasan materi yang telah dipelajari..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="tags">Tag/Kategori (pisahkan dengan koma)</label>
                        <input type="text" id="tags" placeholder="Contoh: algoritma, sorting, array">
                    </div>
                    
                    <button type="submit">Simpan Ringkasan</button>
                </form>
            </section>
            
            <section class="summary-list">
                <h2>Daftar Ringkasan</h2>
                <div id="summaryList">
                    <!-- Ringkasan akan ditampilkan di sini -->
                </div>
            </section>
        </div>
    </div>

    <script>
        // Inisialisasi data jika belum ada
        if (!localStorage.getItem('lectureSummaries')) {
            localStorage.setItem('lectureSummaries', JSON.stringify([]));
        }

        // Fungsi untuk mendapatkan data dari localStorage
        function getSummaries() {
            return JSON.parse(localStorage.getItem('lectureSummaries'));
        }

        // Fungsi untuk menyimpan data ke localStorage
        function saveSummaries(summaries) {
            localStorage.setItem('lectureSummaries', JSON.stringify(summaries));
        }

        // Fungsi untuk menampilkan ringkasan
        function displaySummaries() {
            const summaries = getSummaries();
            const summaryList = document.getElementById('summaryList');
            
            if (summaries.length === 0) {
                summaryList.innerHTML = `
                    <div class="empty-state">
                        <i>📝</i>
                        <h3>Belum ada ringkasan</h3>
                        <p>Mulai dengan menambahkan ringkasan pertemuan kuliah pertama Anda.</p>
                    </div>
                `;
                return;
            }
            
            // Urutkan berdasarkan tanggal (terbaru di atas)
            summaries.sort((a, b) => new Date(b.meetingDate) - new Date(a.meetingDate));
            
            summaryList.innerHTML = summaries.map((summary, index) => `
                <div class="summary-item">
                    <div class="summary-header">
                        <div class="summary-title">${summary.courseName} - Pertemuan ${summary.meetingNumber}</div>
                    </div>
                    <div class="summary-meta">
                        <span>${formatDate(summary.meetingDate)}</span>
                        <span>•</span>
                        <span>${summary.lecturer}</span>
                    </div>
                    <div class="summary-content">
                        <strong>Topik:</strong> ${summary.topic}<br><br>
                        ${summary.summary}
                    </div>
                    <div class="tags">
                        ${summary.tags ? summary.tags.split(',').map(tag => `<span class="tag">${tag.trim()}</span>`).join('') : ''}
                    </div>
                    <div class="actions">
                        <button class="btn-delete" onclick="deleteSummary(${index})">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        // Fungsi untuk memformat tanggal
        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        // Fungsi untuk menambah ringkasan
        function addSummary(event) {
            event.preventDefault();
            
            const courseName = document.getElementById('courseName').value;
            const meetingNumber = document.getElementById('meetingNumber').value;
            const meetingDate = document.getElementById('meetingDate').value;
            const lecturer = document.getElementById('lecturer').value;
            const topic = document.getElementById('topic').value;
            const summary = document.getElementById('summary').value;
            const tags = document.getElementById('tags').value;
            
            const newSummary = {
                courseName,
                meetingNumber,
                meetingDate,
                lecturer,
                topic,
                summary,
                tags,
                createdAt: new Date().toISOString()
            };
            
            const summaries = getSummaries();
            summaries.push(newSummary);
            saveSummaries(summaries);
            
            // Reset form
            document.getElementById('summaryForm').reset();
            
            // Tampilkan ulang daftar ringkasan
            displaySummaries();
            
            // Tampilkan notifikasi
            alert('Ringkasan berhasil disimpan!');
        }

        // Fungsi untuk menghapus ringkasan
        function deleteSummary(index) {
            if (confirm('Apakah Anda yakin ingin menghapus ringkasan ini?')) {
                const summaries = getSummaries();
                summaries.splice(index, 1);
                saveSummaries(summaries);
                displaySummaries();
            }
        }

        // Event listener untuk form
        document.getElementById('summaryForm').addEventListener('submit', addSummary);

        // Tampilkan ringkasan saat halaman dimuat
        document.addEventListener('DOMContentLoaded', displaySummaries);

        // Set nilai default untuk tanggal ke hari ini
        document.getElementById('meetingDate').valueAsDate = new Date();
    </script>
</body>
</html>
